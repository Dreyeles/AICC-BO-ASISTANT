<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RPA AICC Maestro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <h1>RPA Maestro</h1>
          <span class="version">AICC Cloud v1.0</span>
        </div>
      </div>
      <div class="status-indicator" id="statusBadge">Apagado</div>
    </header>

    <div class="main-card">
      <div class="toggle-row">
        <div>
          <label class="toggle-title" for="toggleSistema">Activar Sistema</label>
          <div class="toggle-subtitle" id="toggleSubtitle">Presiona F9 o activa aquí</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleSistema">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="state-detail" id="stateDetailBox">
        <div class="detail-row">
          <span class="detail-label">Fase Actual:</span>
          <span class="detail-value" id="faseActualVal">DETENIDO</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Temporizador:</span>
          <span class="detail-value timer-value" id="timerVal">--</span>
        </div>
      </div>
    </div>

    <details class="settings-accordion">
      <summary class="settings-title">⚙️ Ajustes de Tiempos</summary>
      <div class="settings-body">
        <div class="field-group">
          <label for="inputTiempoPausa">Tiempo de Pausa (segundos):</label>
          <input type="number" id="inputTiempoPausa" min="10" max="3600" value="60">
        </div>

        <div class="field-group">
          <label for="inputTiempoFlash">Tiempo Flash Disponible (segundos):</label>
          <input type="number" id="inputTiempoFlash" min="1" max="60" value="3">
        </div>

        <div class="field-group">
          <label for="inputMotivoPausa">Texto del Motivo:</label>
          <input type="text" id="inputMotivoPausa" value="Pausa">
        </div>

        <button id="btnGuardarConfig" class="btn-primary">Guardar Ajustes</button>
        <div class="save-feedback" id="saveFeedback"></div>
      </div>
    </details>

    <footer class="footer">
      <span>Atajo: <strong>F9</strong> en la pestaña activa</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
